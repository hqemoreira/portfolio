<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rule</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,200&family=JetBrains+Mono:wght@400&family=Lora:wght@400&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: #F0EDE5; }
  .banner { position: relative; width: 1584px; height: 396px; background: #F0EDE5; color: #17191C; }
  .copy { position: absolute; left: 468px; top: 86px; width: 1040px; }
  .who {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.28em; color: #777B80; margin-bottom: 26px;
  }
  .lead {
    font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 38px;
    letter-spacing: -0.03em; line-height: 1;
  }
  .row { display: flex; align-items: flex-end; margin-top: 10px; }
  .biz {
    font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 200;
    font-size: 68px; line-height: 0.85; letter-spacing: -0.035em; color: #D4891E;
    border-bottom: 1.5px solid #D4891E; padding-bottom: 6px;
  }
  .rule {
    flex: 1; height: 1px; margin: 0 0 6px 16px; background: #B7B5AD;
  }
  .secondary {
    margin-top: 22px; max-width: 620px;
    font-family: Lora, Georgia, serif; font-size: 17px; line-height: 1.45; color: #17191C;
  }
  .meta {
    margin-top: 16px;
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.18em; color: #777B80;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="copy">
    <div class="who">HENRIQUE MOREIRA</div>
    <div class="lead">18 years understanding</div>
    <div class="row">
      <div class="biz">business.</div>
      <div class="rule" aria-hidden="true"></div>
    </div>
    <p class="secondary">Now applying AI and technology to make businesses work better.</p>
    <div class="meta">APPLIED AI&nbsp;&nbsp;/&nbsp;&nbsp;BUSINESS TRANSFORMATION&nbsp;&nbsp;/&nbsp;&nbsp;INTERNATIONAL B2B</div>
  </div>
</div>
</body>
</html>
