<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aside</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,200&family=JetBrains+Mono:wght@400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: #17191C; }
  .banner { position: relative; width: 1584px; height: 396px; background: #17191C; color: #F0EDE5; }
  .copy { position: absolute; left: 468px; top: 72px; width: 760px; }
  .who {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.28em; color: #777B80; margin-bottom: 26px;
  }
  .lead {
    font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 40px;
    letter-spacing: -0.03em; line-height: 1; color: #F0EDE5;
  }
  .biz {
    margin-top: 6px;
    font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 200;
    font-size: 70px; line-height: 0.88; letter-spacing: -0.035em; color: #D4891E;
  }
  .note { display: flex; gap: 14px; margin-top: 26px; max-width: 560px; align-items: flex-start; }
  .tick { width: 2px; height: 22px; margin-top: 3px; background: #D4891E; flex: none; }
  .secondary {
    font-family: Lora, Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 17px; line-height: 1.45; color: #B7B5AD;
  }
  .meta {
    margin-top: 20px;
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.18em; color: #777B80;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="copy">
    <div class="who">HENRIQUE MOREIRA</div>
    <div class="lead">18 years understanding</div>
    <div class="biz">business.</div>
    <div class="note">
      <div class="tick" aria-hidden="true"></div>
      <p class="secondary">Now applying AI and technology to make businesses work better.</p>
    </div>
    <div class="meta">APPLIED AI&nbsp;&nbsp;/&nbsp;&nbsp;BUSINESS TRANSFORMATION&nbsp;&nbsp;/&nbsp;&nbsp;INTERNATIONAL B2B</div>
  </div>
</div>
</body>
</html>
