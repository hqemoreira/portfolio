<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1584" />
  <title>LinkedIn Banner — Understated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=JetBrains+Mono:wght@400&family=Lora:wght@400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #07080D;
    }
    .banner {
      position: relative;
      width: 1584px;
      height: 396px;
      background: linear-gradient(90deg, #07080D 0%, #0A0C11 100%);
      color: #F0E8D8;
      -webkit-font-smoothing: antialiased;
    }
    .quiet-rule {
      position: absolute;
      left: 168px;
      top: 48px;
      width: 1px;
      height: 120px;
      background: rgba(240, 232, 216, 0.06);
    }
    .copy {
      position: absolute;
      left: 700px;
      top: 50%;
      transform: translateY(-50%);
      width: 820px;
      padding-right: 56px;
    }
    .primary {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: 40px;
      letter-spacing: -0.3px;
      line-height: 1.15;
      color: #F0E8D8;
      margin-bottom: 18px;
    }
    .secondary {
      font-family: Lora, Georgia, serif;
      font-weight: 400;
      font-size: 21px;
      line-height: 1.4;
      color: #CDC4B4;
      max-width: 720px;
    }
    .descriptor {
      margin-top: 28px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 400;
      font-size: 10.5px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #9A8A6A;
    }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="quiet-rule" aria-hidden="true"></div>
    <div class="copy">
      <div class="primary">18 years understanding business.</div>
      <div class="secondary">Now applying AI and technology to make businesses work better.</div>
      <div class="descriptor">APPLIED AI&nbsp;&nbsp;·&nbsp;&nbsp;BUSINESS TRANSFORMATION&nbsp;&nbsp;·&nbsp;&nbsp;INTERNATIONAL B2B</div>
    </div>
  </div>
</body>
</html>
