<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1584" />
  <title>LinkedIn Banner — Primary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #07080D;
    }
    .banner {
      position: relative;
      width: 1584px;
      height: 396px;
      background:
        radial-gradient(ellipse 40% 55% at 22% 38%, rgba(92, 58, 30, 0.22), transparent 70%),
        radial-gradient(ellipse 55% 70% at 72% 42%, rgba(212, 137, 30, 0.10), rgba(166, 124, 82, 0.05) 45%, transparent 70%),
        linear-gradient(135deg, #0A0B10 0%, #07080D 55%, #0B0C12 100%);
      color: #F0E8D8;
      -webkit-font-smoothing: antialiased;
    }
    /* Quiet left architecture — kept above photo overlap zone */
    .grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .grid svg { display: block; }
    .divider {
      position: absolute;
      left: 620px;
      top: 70px;
      bottom: 70px;
      width: 1px;
      background: rgba(240, 232, 216, 0.05);
    }
    .copy {
      position: absolute;
      left: 700px;
      top: 50%;
      transform: translateY(-50%);
      width: 820px;
      padding-right: 56px;
    }
    .primary {
      font-family: Fraunces, Georgia, serif;
      font-weight: 600;
      font-size: 42px;
      letter-spacing: -0.4px;
      line-height: 1.15;
      color: #F0E8D8;
    }
    .accent {
      display: block;
      width: 56px;
      height: 1.5px;
      margin: 14px 0 18px;
      background: #D4891E;
      opacity: 0.85;
    }
    .secondary {
      font-family: Lora, Georgia, serif;
      font-weight: 400;
      font-size: 22px;
      line-height: 1.4;
      color: #CDC4B4;
      max-width: 720px;
    }
    .descriptor {
      margin-top: 28px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #9AABBA;
    }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="grid" aria-hidden="true">
      <svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
        <g opacity="0.35" stroke="#A67C52" stroke-width="1" fill="none">
          <path d="M120 36 V210" opacity="0.45"/>
          <path d="M220 28 V175" opacity="0.28"/>
          <path d="M320 48 V155" opacity="0.2"/>
          <path d="M72 72 H360" opacity="0.35"/>
          <path d="M96 128 H300" opacity="0.22"/>
          <path d="M140 176 H280" opacity="0.16"/>
        </g>
        <g fill="#D4891E">
          <circle cx="120" cy="72" r="2.2" opacity="0.7"/>
          <circle cx="220" cy="72" r="1.6" opacity="0.45"/>
          <circle cx="320" cy="128" r="1.8" opacity="0.4"/>
          <circle cx="220" cy="128" r="1.4" opacity="0.35"/>
          <circle cx="140" cy="176" r="1.5" opacity="0.3"/>
        </g>
        <g stroke="#D4891E" stroke-width="1" fill="none" opacity="0.28">
          <path d="M120 72 L220 72 L320 128"/>
          <path d="M220 72 L220 128 L140 176"/>
        </g>
      </svg>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="copy">
      <div class="primary">18 years understanding business.</div>
      <span class="accent" aria-hidden="true"></span>
      <div class="secondary">Now applying AI and technology to make businesses work better.</div>
      <div class="descriptor">APPLIED AI&nbsp;&nbsp;·&nbsp;&nbsp;BUSINESS TRANSFORMATION&nbsp;&nbsp;·&nbsp;&nbsp;INTERNATIONAL B2B</div>
    </div>
  </div>
</body>
</html>
