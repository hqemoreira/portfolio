<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Henrique Moreira LinkedIn Banner  Understated</title>
  <desc id="desc">18 years understanding business. Now applying AI and technology to make businesses work better.</desc>

  <defs>
    <linearGradient id="stageAlt" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#07080D"/>
      <stop offset="100%" stop-color="#0A0C11"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#stageAlt)"/>

  <!-- Extremely quiet left: one faint vertical rule only (above photo zone) -->
