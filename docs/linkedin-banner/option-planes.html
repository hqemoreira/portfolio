<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Planes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,200&family=JetBrains+Mono:wght@400&family=Lora:wght@400&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: #F0EDE5; }
  .banner { position: relative; width: 1584px; height: 396px; overflow: hidden; background: #F0EDE5; color: #17191C; }
  .block { position: absolute; background: #17191C; width: 420px; height: 460px; right: -90px; top: -70px; }
  .bar { position: absolute; background: #B7B5AD; width: 560px; height: 18px; left: 980px; top: 268px; }
  .amber { position: absolute; background: #D4891E; width: 108px; height: 108px; left: 1168px; top: 78px; }
  .slash { position: absolute; background: #F0EDE5; width: 14px; height: 200px; left: 1210px; top: 40px; transform: rotate(18deg); }
  .copy { position: absolute; left: 450px; top: 78px; width: 520px; z-index: 2; }
  .who {
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.28em; color: #777B80; margin-bottom: 22px;
  }
  .lead {
    font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 36px; letter-spacing: -0.03em; line-height: 1;
  }
  .biz {
    margin-top: 4px;
    font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 200;
    font-size: 64px; line-height: 0.86; letter-spacing: -0.04em; color: #D4891E;
  }
  .secondary { margin-top: 18px; max-width: 440px; font-family: Lora, Georgia, serif; font-size: 16px; line-height: 1.4; }
  .meta { margin-top: 14px; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.16em; color: #777B80; }
</style>
</head>
<body>
<div class="banner">
  <div class="block" aria-hidden="true"></div>
  <div class="bar" aria-hidden="true"></div>
  <div class="amber" aria-hidden="true"></div>
  <div class="slash" aria-hidden="true"></div>
  <div class="copy">
    <div class="who">HENRIQUE MOREIRA</div>
    <div class="lead">18 years understanding</div>
    <div class="biz">business.</div>
    <p class="secondary">Now applying AI and technology to make businesses work better.</p>
    <div class="meta">APPLIED AI&nbsp;&nbsp;/&nbsp;&nbsp;BUSINESS TRANSFORMATION&nbsp;&nbsp;/&nbsp;&nbsp;INTERNATIONAL B2B</div>
  </div>
</div>
</body>
</html>
